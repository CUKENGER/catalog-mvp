services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
      build:
        context: ./backend
      command: ["python", "-m", "app.init_storage"]
      environment:
        S3_ENDPOINT_URL: http://minio:9000
        S3_BUCKET: catalog
        S3_ACCESS_KEY: ${MINIO_ROOT_USER}
        S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      depends_on:
        - minio
      restart: "no"

  db-init:
    build:
      context: ./backend
    command: ["python", "-m", "app.init_db"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
      S3_BUCKET: catalog
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
      S3_BUCKET: catalog
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAX_IMAGE_SIZE_BYTES: 8388608
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog-api.rule=PathPrefix(`/api`) || Path(`/health`) || Path(`/docs`) || Path(`/openapi.json`)"
      - "traefik.http.routers.catalog-api.entrypoints=web"
      - "traefik.http.routers.catalog-api.priority=20"
      - "traefik.http.routers.catalog-api.service=catalog-api"
      - "traefik.http.services.catalog-api.loadbalancer.server.port=8000"
    volumes:
      - ./backend:/app
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    profiles: ["bot"]
    build:
      context: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      CATALOG_API_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MAX_IMAGE_SIZE_BYTES: 8388608
      PORT: 8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog-bot.rule=PathPrefix(`/telegram/webhook`)"
      - "traefik.http.routers.catalog-bot.entrypoints=web"
      - "traefik.http.routers.catalog-bot.priority=100"
      - "traefik.http.routers.catalog-bot.service=catalog-bot"
      - "traefik.http.services.catalog-bot.loadbalancer.server.port=8080"
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      CATALOG_API_URL: http://api:8000/api/products
      HOSTNAME: 0.0.0.0
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.catalog-web.entrypoints=web"
      - "traefik.http.routers.catalog-web.priority=1"
      - "traefik.http.routers.catalog-web.service=catalog-web"
      - "traefik.http.services.catalog-web.loadbalancer.server.port=3000"
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped



volumes:
  postgres_data:
  minio_data:
